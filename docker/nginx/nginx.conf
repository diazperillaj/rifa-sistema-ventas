# El proxy inverso termina HTTPS y envía X-Forwarded-Proto. Si no existe, se usa $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # DNS interno de Docker: resuelve rifa-app en cada petición,
    # así nginx no queda con una IP vieja si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://rifa-app:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;

    # El CSS lleva ?v=<versión>, así que se puede guardar en caché
    location /static/ {
        proxy_pass $app_upstream;
        expires 7d;
    }

    location / {
        proxy_pass $app_upstream;
    }
}
