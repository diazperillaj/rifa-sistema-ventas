{% extends "base.html" %}
{% import "components/ui.html" as ui %}

{% block title %}{{ title }} · Rifa{% endblock %}

{% block content %}
  <div class="mx-auto mt-12 max-w-sm text-center sm:mt-20">
    <p class="text-sm font-semibold text-muted tabular-nums">{{ status_code }}</p>
    <h1 class="mt-2 text-2xl font-bold tracking-tight">{{ title }}</h1>
    <p class="mt-2 text-sm text-muted">{{ message }}</p>
    <div class="mt-8">{{ ui.button("Ir al inicio", "secondary", href="/") }}</div>
  </div>
{% endblock %}
