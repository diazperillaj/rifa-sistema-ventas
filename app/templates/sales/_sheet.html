{#- Panel inferior (móvil) / modal (escritorio) para vender un número -#}
<div class="fixed inset-0 z-40 flex items-end justify-center sm:items-center sm:p-4"
     role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="absolute inset-0 bg-ink/40" onclick="closeSheet()"></div>

  <div class="relative max-h-[92dvh] w-full max-w-md overflow-y-auto rounded-t-2xl bg-surface p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] sm:rounded-2xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="sheet-title" class="text-lg font-bold tracking-tight">
          Vender número <span class="text-accent tabular-nums">{{ number | number }}</span>
        </h2>
        <p class="mt-0.5 text-sm text-muted">Valor {{ raffle.ticket_price | money }}</p>
      </div>
      <button type="button" onclick="closeSheet()" aria-label="Cerrar"
              class="-m-2 rounded-lg p-2 text-muted transition-colors hover:bg-subtle hover:text-ink">
        <svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
      </button>
    </div>

    {% include "sales/_new_form.html" %}
  </div>
</div>
