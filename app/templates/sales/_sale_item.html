{#- Una venta en la lista de "Mis ventas". Requiere: sale -#}
<li id="sale-{{ sale.id }}" class="flex items-center gap-4 rounded-xl border border-line bg-surface p-4">
  <span class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-accent-soft text-lg font-bold text-accent tabular-nums">
    {{ sale.number | number }}
  </span>

  <div class="min-w-0 flex-1">
    <p class="truncate font-medium">{{ sale.buyer_name }}</p>
    <p class="truncate text-sm text-muted">
      <a href="tel:{{ sale.buyer_phone | replace(' ', '') }}" class="tabular-nums hover:text-ink">{{ sale.buyer_phone }}</a>
      <span class="hidden sm:inline">· {{ sale.created_at | datetime }}</span>
    </p>
    {% if sale.notes %}<p class="mt-0.5 truncate text-sm text-muted">{{ sale.notes }}</p>{% endif %}
  </div>

  <div class="flex shrink-0 flex-col items-end gap-2">
    <form method="post" action="/ventas/{{ sale.id }}/pagado"
          hx-post="/ventas/{{ sale.id }}/pagado" hx-target="#sale-{{ sale.id }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" title="Cambiar estado de pago"
        class="rounded-md px-2 py-1 text-xs font-semibold transition-colors {{ 'bg-success/10 text-success hover:bg-success/20' if sale.is_paid else 'bg-warning/10 text-warning hover:bg-warning/20' }}">
        {{ "Pagado" if sale.is_paid else "Pendiente" }}
      </button>
    </form>
    <a href="/ventas/{{ sale.id }}/editar" class="text-sm font-medium text-accent hover:text-accent-hover">Editar</a>
  </div>
</li>
