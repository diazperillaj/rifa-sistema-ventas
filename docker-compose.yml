name: rifa

# Evita que los logs llenen el disco del servidor
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: rifa-db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rifa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rifaweb

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: rifa-app
    container_name: rifa-app
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      POSTGRES_HOST: rifa-db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rifaweb

  web:
    image: nginx:1.27-alpine
    container_name: rifa-web
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - proxy
      - rifaweb

networks:
  # Red externa compartida con el proxy inverso
  proxy:
    external: true
  # Red interna del proyecto
  rifaweb:
    name: rifaweb

volumes:
  rifa_pgdata:
    name: rifa_pgdata
